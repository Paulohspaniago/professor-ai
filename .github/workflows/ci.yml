name: Python foundation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.11.16'
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Check formatting, lint, and typing
        env:
          UV_OFFLINE: 'true'
        run: |
          uv run --no-sync ruff format --check .
          uv run --no-sync ruff check .
          uv run --no-sync mypy src/professor_ai
      - name: Run network-blocked behavior tests
        env:
          UV_OFFLINE: 'true'
        run: uv run --no-sync pytest -q
      - name: Validate documentation
        env:
          UV_OFFLINE: 'true'
        run: uv run --no-sync python scripts/check_docs.py
      - name: Validate development fixtures and review packet
        env:
          UV_OFFLINE: 'true'
        run: uv run --no-sync python scripts/check_evals.py --check-review-packet
