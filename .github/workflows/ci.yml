name: Python foundation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.11.16'
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Check formatting, lint, and typing
        env:
          UV_OFFLINE: 'true'
        run: |
          uv run --no-sync ruff format --check .
          uv run --no-sync ruff check .
          uv run --no-sync mypy src/professor_ai
      - name: Run network-blocked behavior tests
        env:
          UV_OFFLINE: 'true'
        run: uv run --no-sync pytest -q
      - name: Validate documentation
        env:
          UV_OFFLINE: 'true'
        run: uv run --no-sync python scripts/check_docs.py
      - name: Validate development fixtures and review packet
        env:
          UV_OFFLINE: 'true'
        run: uv run --no-sync python scripts/check_evals.py --check-review-packet
